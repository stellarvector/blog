baseURL: "https://blog.stellarvector.be/"
canonifyURLs: true
locale: "en-us"
title: "Stellar Vector Blog"

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  category: category
  tag: tags

disableKinds:
  - taxonomy

build:
  buildStats:
    enable: true

params:
  description: "Stellar Vector Blog"
  host: "blog"
  measure: "6xl"
  analytics:
    website_id: "00864579-6b3e-432d-bd6a-a402b6bb1f44"
    domains: "blog.stellarvector.be"
  css:
    extra: ["css/chroma.css", "css/custom.css"]
  js:
    extra: ["js/main.js", "js/search.js"]

menu:
  main:
    - name: "home"
      url: "/"
      weight: 1
    - name: "writeups"
      url: "/writeups"
      weight: 2
    - name: "website"
      url: "https://stellarvector.be/?utm_source=blog.stellarvector.be&utm_content=navbar"
      weight: 3
    - name: "find us online"
      url: "https://find.stellarvector.be/?utm_source=blog.stellarvector.be&utm_content=navbar"
      weight: 4

permalinks:
  category: "/writeups/category/:slug/"
  tags: "/writeups/tag/:slug/"

markup:
  goldmark:
    renderer:
      unsafe: true
    tableOfContents:
      startLevel: 2
      endLevel: 3
      ordered: false
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: false
    # Emit CSS classes instead of inline styles, so the palette can follow
    # light/dark mode. Both palettes live in assets/css/chroma.css.
    noClasses: false

minify:
  disableHTML: false
  disableJS: false
  disableCSS: false
  minifyOutput: true
  tdewolff:
    html:
      keepSpecialComments: true
      keepDefaultMethodOnForm: false
      keepDocumentTags: true
      keepEndTags: true
      keepQuotes: true

module:
  imports:
  - path: github.com/stellarvector/theme
security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^npx$'
      - '^postcss$'
      - '^tailwindcss$'
